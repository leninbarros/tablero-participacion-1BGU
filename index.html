<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablero de Participación y Grupos</title>
  
  <!-- ANDROID CHROME CONFIGURACIÓN PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <!-- IPHONE SAFARI CONFIGURACIÓN PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Participación">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 6px 10px;
      text-align: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
    }

    /* ESTILO BASE DE LA TARJETA (PROMEDIO / SIN COLOR) */
    .student-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .student-card:hover {
      border-color: #38bdf8;
      filter: brightness(1.1);
    }

    /* CATEGORÍA: AVANZADO (AMARILLO) */
    .student-card.cat-avanzado {
      background-color: #422006;
      border-color: #eab308;
    }
    .student-card.cat-avanzado .student-number {
      background-color: #eab308;
      color: #0f172a;
    }
    .student-card.cat-avanzado .student-lastname {
      color: #fde047;
    }

    /* CATEGORÍA: NECESITA AYUDA (ROSADO) */
    .student-card.cat-ayuda {
      background-color: #831843;
      border-color: #ec4899;
    }
    .student-card.cat-ayuda .student-number {
      background-color: #ec4899;
      color: #ffffff;
    }
    .student-card.cat-ayuda .student-lastname {
      color: #f472b6;
    }

    /* ESTADO AL HACER CLICK (MARCADO EN CLASE) */
    .student-card.checked {
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      border-color: #38bdf8 !important;
    }

    .number-lastname-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .student-number {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      min-width: 22px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .student-lastname {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
      flex-grow: 1;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      width: 100%;
      text-align: center;
    }

    footer {
      padding: 4px;
      text-align: center;
      background-color: #0f172a;
      flex-shrink: 0;
    }

    .reset-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    
    .reset-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <h1>REGISTRO DE PARTICIPACIÓN - 1 BGU</h1>
  </header>

  <div class="grid-container" id="grid"></div>

  <footer>
    <button class="reset-btn" onclick="resetAll()">Limpiar Selecciones</button>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    /* 
      PUEDES CAMBIAR LA CATEGORÍA A MANO AQUÍ:
      - "avanzado" (Se pintará de amarillo)
      - "ayuda" (Se pintará de rosado)
      - "promedio" (Sin color predeterminado)
    */
    const alumnos = [
      { nombre: "ALBUJA, JUAN MARTIN", categoria: "ayuda" },
      { nombre: "ANGULO, JUAN JOSE", categoria: "avanzado" },
      { nombre: "BORJA, CAMILA RAPHAELA", categoria: "ayuda" },
      { nombre: "CONTRERAS, SAMUEL", categoria: "avanzado" },
      { nombre: "CORTÉS, BENJAMÍN", categoria: "promedio" },
      { nombre: "GALLARDO, NABILA", categoria: "ayuda" },
      { nombre: "GONZÁLEZ, EMILIA", categoria: "avanzado" },
      { nombre: "GUERRERO, LUCIANA", categoria: "avanzado" },
      { nombre: "JARAMILLO, ALEGRÍA", categoria: "ayuda" },
      { nombre: "LARREA, FIORELLA", categoria: "ayuda" },
      { nombre: "LARREA, MATEO", categoria: "avanzado" },
      { nombre: "LOOR, ALISSA SOPHIA", categoria: "promedio" },
      { nombre: "LÓPEZ, EMILIANO JOSÉ", categoria: "promedio" },
      { nombre: "MATA, CAYETANO", categoria: "promedio" },
      { nombre: "MELO, ABIGAIL MICAELA", categoria: "ayuda" },
      { nombre: "MOLINA, NICOLÁS", categoria: "promedio" },
      { nombre: "SAMANIEGO, FERNANDA", categoria: "promedio" },
      { nombre: "SÁNCHEZ, RAPHAELLA CAROLINA", categoria: "ayuda" },
      { nombre: "SANCHEZ, JOSE ALEJANDRO", categoria: "avanzado" },
      { nombre: "SUÁREZ, PAULO", categoria: "avanzado" },
      { nombre: "TOBAR, AGUSTÍN", categoria: "ayuda" },
      { nombre: "TORRES, MATEO", categoria: "promedio" },
      { nombre: "TORRES, MARTINA", categoria: "avanzado" },
      { nombre: "TRUJILLO, SEBASTIÁN MATEO", categoria: "ayuda" }
    ];

    const grid = document.getElementById('grid');

    // Función para abreviar el segundo nombre (ej: JUAN MARTIN -> JUAN M.)
    function formatearNombre(nombresStr) {
      const partes = nombresStr.trim().split(/\s+/);
      if (partes.length > 1) {
        return `${partes[0]} ${partes[1].charAt(0)}.`;
      }
      return nombresStr;
    }

    alumnos.forEach((alumno, index) => {
      const [apellido, nombresOriginales] = alumno.nombre.split(', ');
      const nombresFormateados = formatearNombre(nombresOriginales);
      
      const id = index + 1;
      const numStr = id < 10 ? `0${id}` : id;
      const card = document.createElement('div');
      
      // Asigna la clase de categoría correspondiente de forma automática
      const catClass = `cat-${alumno.categoria || 'promedio'}`;
      card.className = `student-card ${catClass}`;
      card.id = `card-${id}`;
      
      card.setAttribute('onclick', `toggleStatus(${id})`);

      card.innerHTML = `
        <div class="number-lastname-row">
          <div class="student-number">${numStr}</div>
          <div class="student-lastname" title="${apellido}">${apellido}</div>
        </div>
        <div class="student-name" title="${nombresOriginales}">${nombresFormateados}</div>
      `;
      grid.appendChild(card);
    });

    function toggleStatus(id) {
      const card = document.getElementById(`card-${id}`);
      // Alterna un borde brillante al hacer clic para indicar participación activa
      card.classList.toggle('checked');
    }

    function resetAll() {
      alumnos.forEach((_, index) => {
        const id = index + 1;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('checked');
      });
    }
  </script>
</body>
</html>
