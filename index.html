<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablero 1 BGU - Participación y Bitácora</title>
  
  <!-- ANDROID CHROME CONFIGURACIÓN PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <!-- IPHONE SAFARI CONFIGURACIÓN PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tablero 1 BGU">

  <!-- LIBRERÍA JSPDF PARA CREAR PDF DESDE LA WEB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 6px 10px;
      text-align: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
    }

    /* ESTILO BASE DE LA TARJETA */
    .student-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .student-card:hover {
      filter: brightness(1.15);
    }

    /* INDICADOR DE NOTAS */
    .note-indicator {
      position: absolute;
      top: 4px;
      left: 6px;
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      display: none;
    }
    .student-card.has-notes .note-indicator {
      display: block;
    }

    /* ESTRELLA PARA AVANZADOS */
    .star-badge {
      position: absolute;
      top: 3px;
      right: 5px;
      color: #facc15;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 
        -1px -1px 0 #713f12,  
         1px -1px 0 #713f12,
        -1px  1px 0 #713f12,
         1px  1px 0 #713f12,
         0 2px 4px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    /* CATEGORÍAS */
    .student-card.cat-avanzado {
      background-color: #fef08a;
      border-color: #eab308;
    }
    .student-card.cat-avanzado .student-number { background-color: #ca8a04; color: #fef08a; }
    .student-card.cat-avanzado .student-lastname { color: #854d0e; }
    .student-card.cat-avanzado .student-name { color: #713f12; }

    .student-card.cat-ayuda {
      background-color: #e9d5ff;
      border-color: #a855f7;
    }
    .student-card.cat-ayuda .student-number { background-color: #7e22ce; color: #f3e8ff; }
    .student-card.cat-ayuda .student-lastname { color: #6b21a8; }
    .student-card.cat-ayuda .student-name { color: #581c87; }

    /* ESTADO USADO */
    .student-card.used {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      opacity: 0.3;
    }
    .student-card.used .student-number { background-color: #475569 !important; color: #94a3b8 !important; }
    .student-card.used .student-lastname,
    .student-card.used .student-name { color: #64748b !important; text-decoration: line-through; }
    .student-card.used .star-badge { opacity: 0.2; }

    .number-lastname-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .student-number {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      min-width: 22px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .student-lastname {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
      flex-grow: 1;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      width: 100%;
      text-align: center;
    }

    footer {
      padding: 6px 10px;
      text-align: center;
      background-color: #0f172a;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .reset-btn { background-color: #ef4444; color: white; }
    .reset-btn:hover { background-color: #dc2626; }

    .group-btn { background-color: #0284c7; color: white; }
    .group-btn:hover { background-color: #0369a1; }

    .pdf-btn { background-color: #10b981; color: white; }
    .pdf-btn:hover { background-color: #059669; }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
    }

    .close-modal {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }
    .close-modal:hover { color: #fff; }

    .modal-body {
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    /* BITÁCORA */
    .bitacora-textarea {
      width: 100%;
      height: 80px;
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
    }
    .bitacora-textarea:focus { outline: none; border-color: #38bdf8; }

    .historial-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 5px;
    }
    .nota-item {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nota-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nota-fecha {
      font-size: 11px;
      color: #94a3b8;
    }
    .nota-acciones {
      display: flex;
      gap: 6px;
    }
    .btn-acc {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }
    .btn-editar { color: #38bdf8; }
    .btn-eliminar { color: #ef4444; }

    .modal-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }

    /* GRUPOS */
    .modal-actions-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .group-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      position: relative;
    }
    .group-card h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      color: #facc15;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-copy-group {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-copy-group:hover {
      background-color: #1e293b;
    }
    .group-member {
      font-size: 13px;
      padding: 3px 0;
      display: flex;
      justify-content: space-between;
    }
    .member-role {
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .role-ayuda { background-color: #7e22ce; color: #f3e8ff; }
    .role-avanzado { background-color: #ca8a04; color: #fef08a; }
    .role-promedio { background-color: #475569; color: #f8fafc; }
  </style>
</head>
<body>

  <header>
    <h1>REGISTRO DE PARTICIPACIÓN - 1 BGU</h1>
  </header>

  <div class="grid-container" id="grid"></div>

  <footer>
    <button class="action-btn group-btn" onclick="generarGrupos()">✨ Crear Grupos Automáticos</button>
    <button class="action-btn reset-btn" onclick="resetAll()">Restaurar Todo el Tablero</button>
  </footer>

  <!-- MODAL DE GRUPOS -->
  <div class="modal-overlay" id="modalGrupos">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Equipos de Trabajo Optimizados</h2>
        <button class="close-modal" onclick="cerrarModalGrupos()">×</button>
      </div>
      <div class="modal-actions-top">
        <button class="action-btn group-btn" style="font-size: 12px; padding: 4px 10px;" onclick="copiarTodosLosGrupos()">📋 Copiar Todos los Grupos</button>
      </div>
      <div class="modal-body group-grid" id="modalBodyGrupos"></div>
    </div>
  </div>

  <!-- MODAL DE BITÁCORA / EXPEDIENTE -->
  <div class="modal-overlay" id="modalBitacora">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tituloBitacora">Bitácora del Estudiante</h2>
        <button class="close-modal" onclick="cerrarModalBitacora()">×</button>
      </div>
      <div class="modal-body">
        <label id="labelEditorNota" style="font-size: 13px; color: #38bdf8; font-weight: bold;">Agregar nueva nota o compromiso:</label>
        <textarea id="textoNuevaNota" class="bitacora-textarea" placeholder="Escribe aquí acuerdos, adaptaciones o ideas de mejora..."></textarea>
        
        <div class="modal-footer-actions">
          <button class="action-btn group-btn" id="btnGuardarNota" onclick="guardarNotaBitacora()">💾 Guardar Nota</button>
          <button class="action-btn pdf-btn" onclick="descargarPDFBitacora()">📄 Descargar Reporte PDF</button>
        </div>
        
        <label style="font-size: 13px; color: #94a3b8; font-weight: bold; margin-top: 10px;">Historial de Bitácora:</label>
        <div class="historial-lista" id="historialLista"></div>
      </div>
    </div>
  </div>

  <!-- SCRIPT CON FIREBASE Y LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcmoMtCw0Vjp1aZbHqkOfqejfg19ghzgg",
      authDomain: "participacion1bgu.firebaseapp.com",
      projectId: "participacion1bgu",
      storageBucket: "participacion1bgu.firebasestorage.app",
      messagingSenderId: "663983703486",
      appId: "1:663983703486:web:7969ef175c15717ac2a5ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const alumnos = [
      { id: 1, nombre: "ALBUJA, JUAN MARTIN", categoria: "ayuda" },
      { id: 2, nombre: "ANGULO, JUAN JOSE", categoria: "avanzado" },
      { id: 3, nombre: "BORJA, CAMILA RAPHAELA", categoria: "ayuda" },
      { id: 4, nombre: "CONTRERAS, SAMUEL", categoria: "avanzado" },
      { id: 5, nombre: "CORTÉS, BENJAMÍN", categoria: "promedio" },
      { id: 6, nombre: "GALLARDO, NABILA", categoria: "ayuda" },
      { id: 7, nombre: "GONZÁLEZ, EMILIA", categoria: "avanzado" },
      { id: 8, nombre: "GUERRERO, LUCIANA", categoria: "avanzado" },
      { id: 9, nombre: "JARAMILLO, ALEGRÍA", categoria: "ayuda" },
      { id: 10, nombre: "LARREA, FIORELLA", categoria: "ayuda" },
      { id: 11, nombre: "LARREA, MATEO", categoria: "avanzado" },
      { id: 12, nombre: "LOOR, ALISSA SOPHIA", categoria: "promedio" },
      { id: 13, nombre: "LÓPEZ, EMILIANO JOSÉ", categoria: "promedio" },
      { id: 14, nombre: "MATA, CAYETANO", categoria: "promedio" },
      { id: 15, nombre: "MELO, ABIGAIL MICAELA", categoria: "ayuda" },
      { id: 16, nombre: "MOLINA, NICOLÁS", categoria: "promedio" },
      { id: 17, nombre: "SAMANIEGO, FERNANDA", categoria: "promedio" },
      { id: 18, nombre: "SÁNCHEZ, RAPHAELLA CAROLINA", categoria: "ayuda" },
      { id: 19, nombre: "SANCHEZ, JOSE ALEJANDRO", categoria: "avanzado" },
      { id: 20, nombre: "SUÁREZ, PAULO", categoria: "avanzado" },
      { id: 21, nombre: "TOBAR, AGUSTÍN", categoria: "ayuda" },
      { id: 22, nombre: "TORRES, MATEO", categoria: "promedio" },
      { id: 23, nombre: "TORRES, MARTINA", categoria: "avanzado" },
      { id: 24, nombre: "TRUJILLO, SEBASTIÁN MATEO", categoria: "ayuda" }
    ];

    const grid = document.getElementById('grid');
    let alumnoActualId = null;
    let alumnoActualNombre = "";
    let bitacorasGlobal = {};
    let editandoIndice = null;
    let gruposUltimos = [];

    function formatearNombre(nombresStr) {
      const partes = nombresStr.trim().split(/\s+/);
      if (partes.length > 1) {
        return `${partes[0]} ${partes[1].charAt(0)}.`;
      }
      return nombresStr;
    }

    async function cargarBitacorasNube() {
      try {
        const querySnapshot = await getDocs(collection(db, "bitacoras"));
        querySnapshot.forEach((docSnap) => {
          bitacorasGlobal[docSnap.id] = docSnap.data().notas || [];
        });
        actualizarIndicadoresNotas();
      } catch (e) {
        console.error("Error cargando bitácoras: ", e);
      }
    }

    function actualizarIndicadoresNotas() {
      alumnos.forEach(alumno => {
        const card = document.getElementById(`card-${alumno.id}`);
        if (card) {
          if (bitacorasGlobal[alumno.id] && bitacorasGlobal[alumno.id].length > 0) {
            card.classList.add('has-notes');
          } else {
            card.classList.remove('has-notes');
          }
        }
      });
    }

    alumnos.forEach((alumno) => {
      const [apellido, nombresOriginales] = alumno.nombre.split(', ');
      const nombresFormateados = formatearNombre(nombresOriginales);
      const numStr = alumno.id < 10 ? `0${alumno.id}` : alumno.id;
      
      const card = document.createElement('div');
      const catClass = `cat-${alumno.categoria}`;
      card.className = `student-card ${catClass}`;
      card.id = `card-${alumno.id}`;

      const estrellaHtml = alumno.categoria === 'avanzado' ? '<div class="star-badge">★</div>' : '';

      card.innerHTML = `
        <div class="note-indicator"></div>
        ${estrellaHtml}
        <div class="number-lastname-row">
          <div class="student-number">${numStr}</div>
          <div class="student-lastname" title="${apellido}">${apellido}</div>
        </div>
        <div class="student-name" title="${nombresOriginales}">${nombresFormateados}</div>
      `;

      let pressTimer = null;
      const startPress = () => {
        pressTimer = setTimeout(() => {
          abrirBitacora(alumno.id, alumno.nombre);
        }, 600);
      };
      const cancelPress = () => clearTimeout(pressTimer);

      card.addEventListener('mousedown', startPress);
      card.addEventListener('mouseup', cancelPress);
      card.addEventListener('mouseleave', cancelPress);
      card.addEventListener('touchstart', startPress);
      card.addEventListener('touchend', cancelPress);

      card.addEventListener('click', () => {
        toggleStatus(alumno.id);
      });

      grid.appendChild(card);
    });

    window.toggleStatus = function(id) {
      const card = document.getElementById(`card-${id}`);
      card.classList.toggle('used');
    }

    window.resetAll = function() {
      alumnos.forEach((alumno) => {
        const card = document.getElementById(`card-${alumno.id}`);
        card.classList.remove('used');
      });
    }

    window.abrirBitacora = function(id, nombreCompleto) {
      alumnoActualId = id;
      alumnoActualNombre = nombreCompleto;
      editandoIndice = null;
      document.getElementById('tituloBitacora').innerText = `Bitácora: ${nombreCompleto}`;
      document.getElementById('textoNuevaNota').value = '';
      document.getElementById('labelEditorNota').innerText = "Agregar nueva nota o compromiso:";
      document.getElementById('btnGuardarNota').innerText = "💾 Guardar Nota";
      renderizarHistorialNotas();
      document.getElementById('modalBitacora').classList.add('active');
    }

    window.cerrarModalBitacora = function() {
      document.getElementById('modalBitacora').classList.remove('active');
      actualizarIndicadoresNotas();
    }

    function renderizarHistorialNotas() {
      const lista = document.getElementById('historialLista');
      lista.innerHTML = '';
      const notas = bitacorasGlobal[alumnoActualId] || [];

      if (notas.length === 0) {
        lista.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; padding: 10px;">No hay notas registradas todavía.</div>';
        return;
      }

      notas.forEach((n, idx) => {
        let div = document.createElement('div');
        div.className = 'nota-item';
        div.innerHTML = `
          <div class="nota-header-row">
            <span class="nota-fecha">📅 ${n.fecha}</span>
            <div class="nota-acciones">
              <button class="btn-acc btn-editar" onclick="prepararEdicionNota(${idx})">✏️ Editar</button>
              <button class="btn-acc btn-eliminar" onclick="eliminarNotaBitacora(${idx})">🗑️ Eliminar</button>
            </div>
          </div>
          <div>${n.texto}</div>
        `;
        lista.appendChild(div);
      });
    }

    window.guardarNotaBitacora = async function() {
      const texto = document.getElementById('textoNuevaNota').value.trim();
      if (!texto) return alert("Escribe una nota antes de guardar.");

      if (!bitacorasGlobal[alumnoActualId]) {
        bitacorasGlobal[alumnoActualId] = [];
      }

      const ahora = new Date();
      const fechaFormateada = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (editandoIndice !== null) {
        bitacorasGlobal[alumnoActualId][editandoIndice].texto = texto;
        bitacorasGlobal[alumnoActualId][editandoIndice].fecha = fechaFormateada + " (Modificada)";
        editandoIndice = null;
        document.getElementById('labelEditorNota').innerText = "Agregar nueva nota o compromiso:";
        document.getElementById('btnGuardarNota').innerText = "💾 Guardar Nota";
      } else {
        bitacorasGlobal[alumnoActualId].push({
          texto: texto,
          fecha: fechaFormateada
        });
      }

      try {
        await setDoc(doc(db, "bitacoras", String(alumnoActualId)), {
          notas: bitacorasGlobal[alumnoActualId]
        });
        document.getElementById('textoNuevaNota').value = '';
        renderizarHistorialNotas();
        actualizarIndicadoresNotas();
      } catch (e) {
        console.error("Error al guardar en Firebase: ", e);
        alert("Hubo un error al guardar en la nube. Revisa tu conexión.");
      }
    }

    window.prepararEdicionNota = function(idx) {
      editandoIndice = idx;
      const nota = bitacorasGlobal[alumnoActualId][idx];
      document.getElementById('textoNuevaNota').value = nota.texto;
      document.getElementById('labelEditorNota').innerText = `Editando nota #${idx + 1}:`;
      document.getElementById('btnGuardarNota').innerText = "💾 Actualizar Nota";
      document.getElementById('textoNuevaNota').focus();
    }

    window.eliminarNotaBitacora = async function(idx) {
      if (!confirm("¿Estás seguro de eliminar esta nota de la bitácora?")) return;

      bitacorasGlobal[alumnoActualId].splice(idx, 1);
      
      try {
        await setDoc(doc(db, "bitacoras", String(alumnoActualId)), {
          notas: bitacorasGlobal[alumnoActualId]
        });
        renderizarHistorialNotas();
        actualizarIndicadoresNotas();
      } catch (e) {
        console.error("Error al eliminar nota: ", e);
      }
    }

    window.descargarPDFBitacora = function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const notas = bitacorasGlobal[alumnoActualId] || [];

      doc.setFillColor(30, 41, 59);
      doc.rect(0, 0, 210, 30, "F");

      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("REPORTE DE SEGUIMIENTO Y BITÁCORA", 14, 18);

      doc.setTextColor(15, 23, 42);
      doc.setFontSize(12);
      doc.text(`Estudiante: ${alumnoActualNombre}`, 14, 45);
      doc.text(`Fecha de emisión: ${new Date().toLocaleDateString()}`, 14, 53);

      doc.setDrawColor(56, 189, 248);
      doc.line(14, 58, 196, 58);

      let yPos = 70;
      doc.setFontSize(11);

      if (notas.length === 0) {
        doc.setTextColor(100, 100, 100);
        doc.text("No registra anotaciones ni compromisos previos en su bitácora.", 14, yPos);
      } else {
        notas.forEach((n, index) => {
          if (yPos > 270) {
            doc.addPage();
            yPos = 20;
          }
          doc.setFont("helvetica", "bold");
          doc.setTextColor(2, 132, 199);
          doc.text(`Registro #${index + 1} - ${n.fecha}`, 14, yPos);
          
          doc.setFont("helvetica", "normal");
          doc.setTextColor(15, 23, 42);
          
          const textoLineas = doc.splitTextToSize(n.texto, 180);
          doc.text(textoLineas, 14, yPos + 6);
          
          yPos += (textoLineas.length * 6) + 14;
        });
      }

      doc.setFontSize(9);
      doc.setTextColor(150, 150, 150);
      doc.text("Sistema de Acompañamiento Académico - 1 BGU", 14, 285);

      doc.save(`Bitacora_${alumnoActualNombre.replace(/[^a-zA-Z]/g, "_")}.pdf`);
    }

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    window.generarGrupos = function() {
      const disponibles = alumnos.filter(a => !document.getElementById(`card-${a.id}`).classList.contains('used'));

      if (disponibles.length === 0) {
        alert("¡Todos los estudiantes ya han sido seleccionados o agrupados! Restaura el tablero si deseas volver a agrupar.");
        return;
      }

      let ayudas = shuffle(disponibles.filter(a => a.categoria === 'ayuda'));
      let avanzados = shuffle(disponibles.filter(a => a.categoria === 'avanzado'));
      let promedios = shuffle(disponibles.filter(a => a.categoria === 'promedio'));

      let grupos = [];
      let idsSeleccionados = [];

      while (ayudas.length > 0 && avanzados.length > 0) {
        let ayu = ayudas.pop();
        let av = avanzados.pop();
        let grupoActual = [ayu, av];
        idsSeleccionados.push(ayu.id, av.id);

        if (promedios.length > 0) {
          let prom = promedios.pop();
          grupoActual.push(prom);
          idsSeleccionados.push(prom.id);
        }
        grupos.push(grupoActual);
      }

      let remanentes = [...ayudas, ...avanzados, ...promedios];
      shuffle(remanentes);

      while (remanentes.length > 0) {
        if (remanentes.length === 1 && grupos.length > 0) {
          let ultimo = remanentes.pop();
          grupos[grupos.length - 1].push(ultimo);
          idsSeleccionados.push(ultimo.id);
        } else if (remanentes.length >= 2) {
          let cantidadTomar = (remanentes.length === 3) ? 3 : 2;
          let subGrupo = remanentes.splice(0, cantidadTomar);
          subGrupo.forEach(s => idsSeleccionados.push(s.id));
          grupos.push(subGrupo);
        } else {
          let solo = remanentes.pop();
          idsSeleccionados.push(solo.id);
          grupos.push([solo]);
        }
      }

      gruposUltimos = grupos;

      idsSeleccionados.forEach(id => {
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.add('used');
      });

      const modalBody = document.getElementById('modalBodyGrupos');
      modalBody.innerHTML = '';

      grupos.forEach((g, index) => {
        let cardDiv = document.createElement('div');
        cardDiv.className = 'group-card';
        
        let htmlMembers = g.map(m => {
          let roleClass = `role-${m.categoria}`;
          let roleText = m.categoria === 'ayuda' ? 'Apoyo' : (m.categoria === 'avanzado' ? 'Avanzado ★' : 'Promedio');
          return `<div class="group-member">
            <span>${m.nombre}</span>
            <span class="member-role ${roleClass}">${roleText}</span>
          </div>`;
        }).join('');

        cardDiv.innerHTML = `
          <h3>
            <span>Grupo ${index + 1}</span>
            <button class="btn-copy-group" onclick="copiarGrupo(${index})">📋 Copiar</button>
          </h3>
          ${htmlMembers}
        `;
        modalBody.appendChild(cardDiv);
      });

      document.getElementById('modalGrupos').classList.add('active');
    }

    window.copiarGrupo = function(index) {
      const g = gruposUltimos[index];
      let texto = `*Grupo ${index + 1}*\n` + g.map(m => `- ${m.nombre}`).join('\n');
      navigator.clipboard.writeText(texto).then(() => {
        alert(`¡Grupo ${index + 1} copiado al portapapeles!`);
      }).catch(err => {
        console.error("Error al copiar: ", err);
      });
    }

    window.copiarTodosLosGrupos = function() {
      let textoTotal = "EQUIPOS DE TRABAJO - 1 BGU\n\n";
      gruposUltimos.forEach((g, index) => {
        textoTotal += `*Grupo ${index + 1}*\n` + g.map(m => `- ${m.nombre}`).join('\n') + "\n\n";
      });
      navigator.clipboard.writeText(textoTotal.trim()).then(() => {
        alert("¡Todos los grupos fueron copiados al portapapeles!");
      }).catch(err => {
        console.error("Error al copiar todos: ", err);
      });
    }

    window.cerrarModalGrupos = function() {
      document.getElementById('modalGrupos').classList.remove('active');
    }

    cargarBitacorasNube();
  </script>
</body>
