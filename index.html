<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablero de Participación</title>
  
  <!-- ANDROID / CHROME CONFIGURACIÓN PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22Participacion%201BGU%22,%22short_name%22:%22Participacion%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22}">

  <!-- IPHONE / SAFARI CONFIGURACIÓN PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Participación">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 6px 10px;
      text-align: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
    }

    .student-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .number-lastname-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .student-number {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      min-width: 22px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .student-lastname {
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
      flex-grow: 1;
    }

    .student-name {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      width: 100%;
      text-align: center;
    }

    .check-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #64748b;
      height: 26px;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      flex-shrink: 0;
    }

    .check-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .student-card.active {
      border-color: #22c55e;
      background-color: #064e3b;
    }

    .student-card.active .student-number {
      background-color: #22c55e;
    }
    
    .student-card.active .student-lastname {
      color: #22c55e;
    }

    .student-card.active .check-btn {
      background-color: #22c55e;
      color: #0f172a;
      border-color: #22c55e;
    }

    footer {
      padding: 4px;
      text-align: center;
      background-color: #0f172a;
      flex-shrink: 0;
    }

    .reset-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    
    .reset-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <h1>REGISTRO DE PARTICIPACIÓN EN VIVO 1 BGU</h1>
  </header>

  <div class="grid-container" id="grid"></div>

  <footer>
    <button class="reset-btn" onclick="resetAll()">Reiniciar Todo el Tablero</button>
  </footer>

  <script>
    const alumnos = [
      "ALBUJA, JUAN MARTIN",
      "ANGULO, JUAN JOSE",
      "BORJA, CAMILA RAPHAELA",
      "CONTRERAS, SAMUEL ESTEBAN",
      "CORTÉS, JOSUÉ BENJAMÍN",
      "GALLARDO, EDUARDO NABILA",
      "GONZÁLEZ, EMILIA",
      "GUERRERO, LUCIANA",
      "JARAMILLO, ALEGRÍA RAFAELA",
      "LARREA, FIORELLA",
      "LARREA, RAFAEL MATEO",
      "LOOR, ALISSA SOPHIA",
      "LÓPEZ, EMILIANO JOSÉ",
      "MATA, CAYETANO",
      "MELO, ABIGAIL MICAELA",
      "MOLINA, NICOLÁS",
      "SAMANIEGO, FERNANDA ESTEFANIA",
      "SÁNCHEZ, RAPHAELLA CAROLINA",
      "SANCHEZ, JOSE ALEJANDRO",
      "SUÁREZ, PAULO",
      "AGUSTÍN, TOBAR CABRERA",
      "TORRES, MATEO",
      "TORRES, MARTINA SOLÉ",
      "TRUJILLO, SEBASTIÁN MATEO"
    ];

    const grid = document.getElementById('grid');

    alumnos.forEach((alumnoCompleto, index) => {
      const [apellido, nombres] = alumnoCompleto.split(', ');
      
      const id = index + 1;
      const numStr = id < 10 ? `0${id}` : id;
      const card = document.createElement('div');
      card.className = 'student-card';
      card.id = `card-${id}`;
      card.innerHTML = `
        <div class="card-header">
          <div class="number-lastname-row">
            <div class="student-number">${numStr}</div>
            <div class="student-lastname" title="${apellido}">${apellido}</div>
          </div>
          <div class="student-name" title="${nombres}">${nombres}</div>
        </div>
        <div class="check-btn" onclick="toggleStatus(${id})">
          <span id="text-${id}">⏳</span>
        </div>
      `;
      grid.appendChild(card);
    });

    function toggleStatus(id) {
      activarPantallaCompleta();
      const card = document.getElementById(`card-${id}`);
      const text = document.getElementById(`text-${id}`);
      
      card.classList.toggle('active');
      
      if (card.classList.contains('active')) {
        text.innerHTML = '✔';
      } else {
        text.innerHTML = '⏳';
      }
    }

    function resetAll() {
      for (let i = 1; i <= alumnos.length; i++) {
        const card = document.getElementById(`card-${i}`);
        const text = document.getElementById(`text-${i}`);
        card.classList.remove('active');
        text.innerHTML = '⏳';
      }
    }

    /* Oculta la barra de navegación en Android al hacer el primer toque */
    function activarPantallaCompleta() {
      const doc = document.documentElement;
      if (doc.requestFullscreen) {
        doc.requestFullscreen().catch(() => {});
      } else if (doc.webkitRequestFullscreen) {
        doc.webkitRequestFullscreen().catch(() => {});
      }
    }

    document.body.addEventListener('click', activarPantallaCompleta, { once: true });
  </script>
</body>
</html>
