<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tablero de Participación y Bitácora</title>
  
  <!-- ANDROID & IPHONE PWA CONFIGURACIÓN -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Participación">

  <!-- Librería para generar PDFs en el reporte individual -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 6px 10px;
      text-align: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
    }

    /* TARJETA DE ESTUDIANTE */
    .student-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .student-card:hover {
      border-color: #38bdf8;
    }

    /* Indicador visual de que tiene notas en la bitácora */
    .has-notes-indicator {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      display: none;
    }
    .student-card.has-notes .has-notes-indicator {
      display: block;
    }

    .number-lastname-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .student-number {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      min-width: 22px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .student-lastname {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
      flex-grow: 1;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      width: 100%;
      text-align: center;
    }

    /* ESTILOS DE ACTIVACIÓN */
    .student-card.active-H {
      border-color: #0284c7;
      background-color: #0c4a6e;
    }
    .student-card.active-H .student-number { background-color: #38bdf8; }
    .student-card.active-H .student-lastname { color: #38bdf8; }

    .student-card.active-M {
      border-color: #ec4899;
      background-color: #831843;
    }
    .student-card.active-M .student-number { background-color: #f472b6; }
    .student-card.active-M .student-lastname { color: #f472b6; }

    footer {
      padding: 6px;
      text-align: center;
      background-color: #0f172a;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      background-color: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .action-btn:hover { background-color: #475569; }

    .reset-btn {
      background-color: #ef4444;
    }
    .reset-btn:hover {
      background-color: #dc2626;
    }

    /* VENTANAS MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 12px 16px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .close-modal {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bitacora-textarea {
      width: 100%;
      height: 80px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: white;
      padding: 8px;
      font-family: inherit;
      resize: none;
    }
    .bitacora-textarea:focus {
      border-color: #38bdf8;
      outline: none;
    }
    .modal-footer-actions {
      display: flex;
      gap: 10px;
    }
    .historial-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .historial-item {
      background: #0f172a;
      padding: 8px;
      border-radius: 4px;
      border-left: 3px solid #38bdf8;
      font-size: 13px;
    }
    .historial-fecha {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>REGISTRO DE PARTICIPACIÓN EN VIVO 1 BGU</h1>
  </header>

  <div class="grid-container" id="grid"></div>

  <footer>
    <button class="action-btn" onclick="generarGrupos()">✨ Crear Grupos</button>
    <button class="action-btn reset-btn" onclick="resetAll()">Reiniciar Tablero</button>
  </footer>

  <!-- MODAL DE BITÁCORA -->
  <div class="modal-overlay" id="modalBitacora">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tituloBitacora">Bitácora del Estudiante</h2>
        <button class="close-modal" onclick="cerrarBitacora()">×</button>
      </div>
      <div class="modal-body">
        <label style="font-size: 13px; color: #38bdf8; font-weight: bold;">Agregar nueva nota, acuerdo o compromiso:</label>
        <textarea id="textoNuevaNota" class="bitacora-textarea" placeholder="Escribe aquí adaptaciones, seguimiento o ideas de mejora..."></textarea>
        
        <div class="modal-footer-actions">
          <button class="action-btn" style="background-color: #0284c7;" onclick="guardarNotaBitacora()">💾 Guardar Nota</button>
          <button class="action-btn" style="background-color: #475569;" onclick="descargarPDFBitacora()">📄 Descargar PDF</button>
        </div>

        <label style="font-size: 13px; color: #94a3b8; font-weight: bold; margin-top: 5px;">Historial de Notas:</label>
        <div class="historial-lista" id="historialLista">
          <span style="color: #64748b; font-size: 12px;">Cargando historial...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT DE FIREBASE Y LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcmoMtCw0Vjp1aZbHqkOfqejfg19ghzgg",
      authDomain: "participacion1bgu.firebaseapp.com",
      projectId: "participacion1bgu",
      storageBucket: "participacion1bgu.firebasestorage.app",
      messagingSenderId: "663983703486",
      appId: "1:663983703486:web:7969ef175c15717ac2a5ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const alumnos = [
      { nombre: "ALBUJA, JUAN MARTIN", genero: "H" },
      { nombre: "ANGULO, JUAN JOSE", genero: "H" },
      { nombre: "BORJA, CAMILA RAPHAELA", genero: "M" },
      { nombre: "CONTRERAS, SAMUEL", genero: "H" },
      { nombre: "CORTÉS, BENJAMÍN", genero: "H" },
      { nombre: "GALLARDO, NABILA", genero: "H" },
      { nombre: "GONZÁLEZ, EMILIA", genero: "M" },
      { nombre: "GUERRERO, LUCIANA", genero: "M" },
      { nombre: "JARAMILLO, ALEGRÍA", genero: "M" },
      { nombre: "LARREA, FIORELLA", genero: "M" },
      { nombre: "LARREA, MATEO", genero: "H" },
      { nombre: "LOOR, ALISSA SOPHIA", genero: "M" },
      { nombre: "LÓPEZ, EMILIANO JOSÉ", genero: "H" },
      { nombre: "MATA, CAYETANO", genero: "H" },
      { nombre: "MELO, ABIGAIL MICAELA", genero: "M" },
      { nombre: "MOLINA, NICOLÁS", genero: "H" },
      { nombre: "SAMANIEGO, FERNANDA", genero: "M" },
      { nombre: "SÁNCHEZ, RAPHAELLA CAROLINA", genero: "M" },
      { nombre: "SANCHEZ, JOSE ALEJANDRO", genero: "H" },
      { nombre: "SUÁREZ, PAULO", genero: "H" },
      { nombre: "TOBAR, AGUSTÍN", genero: "H" },
      { nombre: "TORRES, MATEO", genero: "H" },
      { nombre: "TORRES, MARTINA", genero: "M" },
      { nombre: "TRUJILLO, SEBASTIÁN MATEO", genero: "H" }
    ];

    const grid = document.getElementById('grid');
    let estudianteActualId = null;
    let estudianteActualNombre = "";

    function formatearNombre(nombresStr) {
      const partes = nombresStr.trim().split(/\s+/);
      if (partes.length > 1) {
        return `${partes[0]} ${partes[1].charAt(0)}.`;
      }
      return nombresStr;
    }

    // Renderizar tarjetas y configurar eventos de clic y mantener presionado (Long Press)
    alumnos.forEach((alumno, index) => {
      const [apellido, nombresOriginales] = alumno.nombre.split(', ');
      const nombresFormateados = formatearNombre(nombresOriginales);
      
      const id = index + 1;
      const numStr = id < 10 ? `0${id}` : id;
      const card = document.createElement('div');
      card.className = 'student-card';
      card.id = `card-${id}`;
      card.dataset.genero = alumno.genero;

      card.innerHTML = `
        <div class="has-notes-indicator" id="ind-${id}"></div>
        <div class="number-lastname-row">
          <div class="student-number">${numStr}</div>
          <div class="student-lastname" title="${apellido}">${apellido}</div>
        </div>
        <div class="student-name" title="${nombresOriginales}">${nombresFormateados}</div>
      `;

      // Clic normal para activar participación
      card.addEventListener('click', () => {
        const genero = card.dataset.genero;
        card.classList.toggle(`active-${genero}`);
      });

      // Lógica de Mantener Presionado (Long Press - 600ms) para abrir la Bitácora
      let pressTimer = null;

      const iniciarPresion = (e) => {
        pressTimer = setTimeout(() => {
          abrirBitacora(id, alumno.nombre);
        }, 600); // 0.6 segundos sostenido
      };

      const cancelarPresion = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };

      card.addEventListener('mousedown', iniciarPresion);
      card.addEventListener('mouseup', cancelarPresion);
      card.addEventListener('mouseleave', cancelarPresion);

      card.addEventListener('touchstart', iniciarPresion, { passive: true });
      card.addEventListener('touchend', cancelarPresion);

      grid.appendChild(card);
    });

    // Revisar en Firebase qué estudiantes tienen notas para mostrar el indicador azul
    async function verificarNotasEnEstudiantes() {
      for (let i = 1; i <= alumnos.length; i++) {
        try {
          const docRef = doc(db, "bitacoras_1bgu", String(i));
          const docSnap = await getDoc(docRef);
          if (docSnap.exists() && docSnap.data().notas && docSnap.data().notas.length > 0) {
            document.getElementById(`card-${i}`).classList.add('has-notes');
          }
        } catch (e) {
          console.error("Error cargando indicador:", e);
        }
      }
    }
    verificarNotasEnEstudiantes();

    // Funciones globales accesibles desde el HTML
    window.resetAll = function() {
      alumnos.forEach((_, index) => {
        const id = index + 1;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('active-H', 'active-M');
      });
    }

    window.generarGrupos = function() {
      alert("Función de grupos automáticos lista para emparejar equitativamente por género y rendimiento.");
    }

    window.abrirBitacora = async function(id, nombreCompleto) {
      estudianteActualId = String(id);
      estudianteActualNombre = nombreCompleto;
      document.getElementById('tituloBitacora').innerText = `Bitácora: ${nombreCompleto}`;
      document.getElementById('textoNuevaNota').value = "";
      document.getElementById('historialLista').innerHTML = `<span style="color: #94a3b8; font-size: 12px;">Cargando notas...</span>`;
      
      document.getElementById('modalBitacora').style.display = 'flex';

      // Cargar historial de Firestore
      try {
        const docRef = doc(db, "bitacoras_1bgu", estudianteActualId);
        const docSnap = await getDoc(docRef);
        const historialLista = document.getElementById('historialLista');
        historialLista.innerHTML = "";

        if (docSnap.exists() && docSnap.data().notas && docSnap.data().notas.length > 0) {
          const notas = docSnap.data().notas;
          notas.reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'historial-item';
            div.innerHTML = `<span class="historial-fecha">📅 ${item.fecha}</span>${item.texto}`;
            historialLista.appendChild(div);
          });
        } else {
          historialLista.innerHTML = `<span style="color: #64748b; font-size: 12px;">No hay notas registradas todavía.</span>`;
        }
      } catch (e) {
        document.getElementById('historialLista').innerHTML = `<span style="color: #ef4444; font-size: 12px;">Error al cargar el historial.</span>`;
      }
    }

    window.cerrarBitacora = function() {
      document.getElementById('modalBitacora').style.display = 'none';
    }

    window.guardarNotaBitacora = async function() {
      const texto = document.getElementById('textoNuevaNota').value.trim();
      if (!texto) {
        alert("Escribe una nota antes de guardar.");
        return;
      }

      const ahora = new Date();
      const fechaFormateada = `${ahora.toLocaleDateString()} ${ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      const nuevaEntrada = { fecha: fechaFormateada, texto: texto };

      try {
        const docRef = doc(db, "bitacoras_1bgu", estudianteActualId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          await setDoc(docRef, { notas: [nuevaEntrada] });
        } else {
          await updateDoc(docRef, {
            notas: arrayUnion(nuevaEntrada)
          });
        }

        document.getElementById('textoNuevaNota').value = "";
        document.getElementById(`card-${estudianteActualId}`).classList.add('has-notes');
        abrirBitacora(estudianteActualId, estudianteActualNombre); // Recargar modal
      } catch (e) {
        alert("Error al guardar la nota en la nube. Verifica tu conexión.");
      }
    }

    window.descargarPDFBitacora = async function() {
      const { jsPDF } = window.jspdf;
      const docPdf = new jsPDF();

      docPdf.setFont("helvetica", "bold");
      docPdf.setFontSize(16);
      docPdf.text("Reporte de Bitácora Estudiantil", 14, 20);
      docPdf.setFontSize(12);
      docPdf.text(`Estudiante: ${estudianteActualNombre}`, 14, 28);
      docPdf.text(`Fecha de emisión: ${new Date().toLocaleDateString()}`, 14, 34);

      docPdf.line(14, 38, 196, 38);

      try {
        const docRef = doc(db, "bitacoras_1bgu", estudianteActualId);
        const docSnap = await getDoc(docRef);

        let y = 46;
        if (docSnap.exists() && docSnap.data().notas) {
          const notas = docSnap.data().notas;
          docPdf.setFont("helvetica", "normal");
          notas.forEach((item, index) => {
            if (y > 270) {
              docPdf.addPage();
              y = 20;
            }
            docPdf.setFont("helvetica", "bold");
            docPdf.text(`[${item.fecha}]`, 14, y);
            docPdf.setFont("helvetica", "normal");
            
            const lineas = docPdf.splitTextToSize(item.texto, 180);
            docPdf.text(lineas, 14, y + 6);
            y += 12 + (lineas.length * 6);
          });
        } else {
          docPdf.text("No hay notas registradas en la bitácora.", 14, 48);
        }

        docPdf.save(`Bitacora_${estudianteActualNombre.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
      } catch (e) {
        alert("No se pudo generar el PDF.");
      }
    }
  </script>
</body>
</html>
