  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 4px 10px;
      text-align: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 1px;
    }

    /* SWITCH DE VISTA PROFESOR / ESTUDIANTE */
    .view-switch-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #94a3b8;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #0284c7;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
    }

    /* ESTILO BASE DE LA TARJETA (MODO ESTUDIANTE POR DEFECTO) */
    .student-card {
      background-color: #fef08a;
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .student-card:hover {
      filter: brightness(1.05);
    }

    /* INDICADOR DE NOTAS */
    .note-indicator {
      position: absolute;
      top: 3px;
      left: 5px;
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      display: none;
    }
    .student-card.has-notes.teacher-mode .note-indicator {
      display: block;
    }

    /* ESTRELLA PARA AVANZADOS */
    .star-badge {
      position: absolute;
      top: 2px;
      right: 4px;
      color: #facc15;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
      display: none;
    }
    .student-card.teacher-mode.cat-avanzado .star-badge {
      display: block;
    }

    /* MODO ESTUDIANTE: NÚMEROS Y LETRAS DE COLOR AZUL */
    .student-card .student-number {
      background-color: #0284c7;
      color: #fef08a;
      font-weight: bold;
      min-width: 18px;
      height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .student-card .student-lastname {
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1e3a8a;
      flex-grow: 1;
    }

    .student-card .student-name {
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1e3a8a;
      width: 100%;
      text-align: center;
    }

    /* MODO PROFESOR: CATEGORÍAS */
    .student-card.teacher-mode.cat-avanzado {
      background-color: #fef08a;
      border-color: #eab308;
    }
    .student-card.teacher-mode.cat-avanzado .student-number { background-color: #ca8a04; color: #fef08a; }
    .student-card.teacher-mode.cat-avanzado .student-lastname { color: #854d0e; }
    .student-card.teacher-mode.cat-avanzado .student-name { color: #713f12; }

    .student-card.teacher-mode.cat-ayuda {
      background-color: #e9d5ff;
      border-color: #a855f7;
    }
    .student-card.teacher-mode.cat-ayuda .student-number { background-color: #7e22ce; color: #f3e8ff; }
    .student-card.teacher-mode.cat-ayuda .student-lastname { color: #6b21a8; }
    .student-card.teacher-mode.cat-ayuda .student-name { color: #581c87; }

    .student-card.teacher-mode.cat-promedio {
      background-color: #1e293b;
      border-color: #334155;
    }
    .student-card.teacher-mode.cat-promedio .student-number { background-color: #38bdf8; color: #0f172a; }
    .student-card.teacher-mode.cat-promedio .student-lastname { color: #38bdf8; }
    .student-card.teacher-mode.cat-promedio .student-name { color: #f1f5f9; }

    /* ESTADO USADO */
    .student-card.used {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      opacity: 0.3;
    }
    .student-card.used .student-number { background-color: #475569 !important; color: #94a3b8 !important; }
    .student-card.used .student-lastname,
    .student-card.used .student-name { color: #64748b !important; text-decoration: line-through; }

    .number-lastname-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    footer {
      padding: 4px 10px;
      text-align: center;
      background-color: #0f172a;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reset-btn { background-color: #ef4444; color: white; }
    .reset-btn:hover { background-color: #dc2626; }

    .group-btn { background-color: #0284c7; color: white; }
    .group-btn:hover { background-color: #0369a1; }

    .pdf-btn { background-color: #10b981; color: white; }
    .pdf-btn:hover { background-color: #059669; }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      width: 96%;
      max-width: 950px;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }

    .close-modal {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }
    .close-modal:hover { color: #fff; }

    .modal-body {
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    /* BITÁCORA */
    .bitacora-textarea {
      width: 100%;
      height: 70px;
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px;
      resize: vertical;
      font-family: inherit;
      font-size: 13px;
    }
    .bitacora-textarea:focus { outline: none; border-color: #38bdf8; }

    .historial-lista {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 4px;
    }
    .nota-item {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nota-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nota-fecha {
      font-size: 10px;
      color: #94a3b8;
    }
    .nota-acciones {
      display: flex;
      gap: 5px;
    }
    .btn-acc {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      padding: 0;
    }
    .btn-editar { color: #38bdf8; }
    .btn-eliminar { color: #ef4444; }

    .modal-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    /* GRUPOS Y PANTALLA ÉPICA COMPACTA */
    .modal-actions-top {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 6px;
    }

    .epic-banner {
      text-align: center;
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 1px solid #a855f7;
      border-radius: 6px;
      padding: 10px 6px;
      margin-bottom: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 🎃 FANTASMA CON MOVIMIENTO DINÁMICO DE LADO A LADO */
    .halloween-ghost-container {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      animation: moveGhostAcross 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes moveGhostAcross {
      0% {
        transform: translate(0, -50%) translateY(0) scaleX(1);
      }
      48% {
        transform: translate(calc(100vw - 120px), -50%) translateY(-6px) scaleX(1);
      }
      50% {
        transform: translate(calc(100vw - 120px), -50%) translateY(0) scaleX(-1);
      }
      98% {
        transform: translate(0, -50%) translateY(6px) scaleX(-1);
      }
      100% {
        transform: translate(0, -50%) translateY(0) scaleX(1);
      }
    }

    .countdown-timer {
      font-size: 1.8rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
      margin: 1px 0;
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px;
    }
    .group-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .group-card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 3px;
      margin-bottom: 4px;
    }
    .group-card h3 {
      margin: 0;
      font-size: 12px;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-copy-group {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #38bdf8;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .btn-copy-group:hover {
      background-color: #1e293b;
    }

    /* ESTILO RELOJ DIGITAL PARA LA CALIFICACIÓN */
    .digital-score-container {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 3px 6px;
      margin: 3px 0;
      width: 100%;
    }
    .digital-clock {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
      background-color: #0f172a;
      padding: 1px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
      border: 1px solid #1e293b;
    }
    .score-btn {
      background-color: #334155;
      color: white;
      border: none;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .score-btn.plus { background-color: #16a34a; }
    .score-btn.plus:hover { background-color: #15803d; }
    .score-btn.minus { background-color: #dc2626; }
    .score-btn.minus:hover { background-color: #b91c1c; }

    .group-members-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
      margin-top: 2px;
    }
    .group-member-name {
      font-size: 12px;
      color: #f8fafc;
      font-weight: 500;
    }

    #audioContainer { display: none; }
  </style>
</head>

    window.toggleTeacherMode = function() {
      isTeacherMode = document.getElementById('teacherModeToggle').checked;

      cards.forEach(card => {

          card.classList.add('teacher-mode');

          card.classList.remove('teacher-mode');
        }
